context:
  name: spiceypy
  version: 8.3.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: abe5223a80c253c5fa3318a52e80789807d0b1f4dbbc464dc92b35b83024b018

build:
  number: 0

  files:
    exclude:
    - '**/__pycache__/**'
    - '**/*.pyc'
    - '**/test_*.py'
  python:
    skip_pyc_compilation:
    - '**/*.py'

requirements:
  build:
  - ${{ compiler('c') }}
  - cross-python_${{ target_platform }}
  - python
  - pip
  - cmake >=3.24
  - ninja
  - scikit-build-core
  - cython >=3.1
  - numpy >=2.0,<3
  host:
  - python
  - numpy >=2.0,<3
  run:
  - python
  - numpy >=1.23.5

tests:
- script: pytester
  files:
    recipe:
    - test_import_spiceypy.py
  requirements:
    build:
    - pytester
    run:
    - pytester-run

about:
  homepage: https://github.com/AndrewAnnex/SpiceyPy
  repository: https://github.com/AndrewAnnex/SpiceyPy
  documentation: https://spiceypy.readthedocs.io
  license: MIT
  license_file: LICENSE
  summary: A Python Wrapper for the NAIF CSPICE Toolkit

extra:
  recipe-maintainers:
  - AndrewAnnex
